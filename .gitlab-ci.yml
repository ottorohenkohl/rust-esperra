stages:
  - build
  - release

variables:
  FIRMWARE_PACKAGE: "firmware"

build:firmware:
  stage: build
  image: espressif/idf-rust:esp32s3_1.93.0.0
  before_script:
    - . "$HOME/export-esp.sh"
    - python3 -m pip install --user cmake
    - export PATH="$HOME/.local/bin:$(dirname "$(command -v xtensa-esp32s3-elf-gcc)"):$PATH"
  script:
    - cargo build --release
    - espflash save-image --chip esp32s3 --flash-size 8mb --partition-table partitions.csv --target-app-partition factory --merge target/xtensa-esp32s3-none-elf/release/esperra firmware.bin
    - espflash save-image --chip esp32s3 --flash-size 8mb --partition-table partitions.csv --target-app-partition ota_0 target/xtensa-esp32s3-none-elf/release/esperra firmware-ota.bin
  artifacts:
    name: "esperra-firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - firmware.bin
      - firmware-ota.bin
    expire_in: 30 days

release:firmware:
  stage: release
  image: alpine:3.22
  needs:
    - job: build:firmware
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      test "$VERSION" = "$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      SIZE="$(wc -c < firmware-ota.bin | tr -d ' ')"
      SHA256="$(sha256sum firmware-ota.bin | cut -d' ' -f1)"
      PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FIRMWARE_PACKAGE/$VERSION"
      PUBLIC_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FIRMWARE_PACKAGE/$VERSION/firmware-ota.bin"
      printf '{"version":"%s","url":"%s","size":%s,"sha256":"%s"}\n' "$VERSION" "$PUBLIC_URL" "$SIZE" "$SHA256" > manifest.json
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file firmware-ota.bin "$PACKAGE_URL/firmware-ota.bin"
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file manifest.json "$PACKAGE_URL/manifest.json"
      LATEST_ID="$(curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=$FIRMWARE_PACKAGE&package_version=latest" | jq -r '.[0].id // empty')"
      if [ -n "$LATEST_ID" ]; then curl --fail --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$LATEST_ID"; fi
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file manifest.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FIRMWARE_PACKAGE/latest/manifest.json"
