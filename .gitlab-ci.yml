stages:
  - bootloader
  - build
  - release

variables:
  FIRMWARE_PACKAGE: "firmware"

build:bootloader:
  stage: bootloader
  image: espressif/idf:v5.5.2
  script:
    - cd boot
    - idf.py set-target esp32s3 bootloader
    - grep -q '^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y$' sdkconfig
  artifacts:
    paths:
      - boot/build/bootloader/bootloader.bin
    expire_in: 30 days

build:firmware:
  stage: build
  image: espressif/idf-rust:esp32s3_1.93.0.0
  needs:
    - job: build:bootloader
      artifacts: true
  before_script:
    - . "$HOME/export-esp.sh"
    - python3 -m pip install --user --break-system-packages cmake
    - export PATH="$HOME/.local/bin:$(dirname "$(command -v xtensa-esp32s3-elf-gcc)"):$PATH"
  script:
    - cargo build --release
    - espflash save-image --chip esp32s3 --flash-size 8mb --bootloader boot/build/bootloader/bootloader.bin --partition-table res/partitions.csv --target-app-partition factory --merge target/xtensa-esp32s3-none-elf/release/esperra firmware.bin
    - espflash save-image --chip esp32s3 --flash-size 8mb --partition-table res/partitions.csv --target-app-partition ota_0 target/xtensa-esp32s3-none-elf/release/esperra firmware-ota.bin
  artifacts:
    name: "esperra-firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - firmware.bin
      - firmware-ota.bin
    expire_in: 30 days

release:firmware:
  stage: release
  image: alpine:3.22
  needs:
    - job: build:firmware
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      test "$VERSION" = "$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FIRMWARE_PACKAGE/$VERSION"
      LATEST_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FIRMWARE_PACKAGE/latest"
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file firmware-ota.bin "$PACKAGE_URL/firmware-ota.bin"
      LATEST_ID="$(curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=$FIRMWARE_PACKAGE&package_version=latest" | jq -r '.[0].id // empty')"
      if [ -n "$LATEST_ID" ]; then curl --fail --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$LATEST_ID"; fi
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file firmware-ota.bin "$LATEST_URL/firmware-ota.bin"
