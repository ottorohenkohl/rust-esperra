build:firmware:
  image: espressif/idf-rust:esp32s3_1.88.0.0
  before_script:
    - . "$HOME/export-esp.sh"
  script:
    - cargo build --release
    - espflash save-image --chip esp32s3 --merge target/xtensa-esp32s3-none-elf/release/esperra firmware.bin
  artifacts:
    name: "esperra-firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - firmware.bin
    expire_in: 30 days
