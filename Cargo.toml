[package]
edition      = "2024"
name         = "esperra"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esperra"
path = "./src/main.rs"

[dependencies]
embassy-executor        = { version = "0.10.0", features = ["log"] }
embassy-futures         = "0.1.2"
embassy-net             = { version = "0.7.1", features = ["dhcpv4", "dns", "medium-ethernet", "tcp"] }
embassy-sync            = "0.8.0"
embassy-time            = { version = "0.5.0", features = ["log"] }
esp-bootloader-esp-idf  = { version = "0.5.0", features = ["esp32s3", "log-04"] }
esp-backtrace           = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal                 = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-println             = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-radio               = { version = "0.18.0", features = ["esp32s3", "log-04", "wifi"] }
esp-rtos                = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-storage             = { version = "0.9.0", features = ["esp32s3"] }

critical-section        = "1.2.0"
ed25519-dalek           = { version = "2.2.0", default-features = false, features = ["fast"] }
embedded-io-async       = "0.6.1"
embedded-storage        = "0.3.1"
esp-alloc               = "0.10.0"
heapless                = { version = "0.8.0", features = ["serde"] }
log                     = "0.4.28"
onewire                 = "0.4.0"
reqwless                = { version = "0.13.0", default-features = false, features = ["embedded-tls", "log"] }
serde                   = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core         = "0.6.0"
sha2                    = { version = "0.10.9", default-features = false }
static_cell             = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
