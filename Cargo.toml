[package]
edition      = "2024"
name         = "esperra"
rust-version = "1.91"
version      = "0.1.0"

[[bin]]
name = "esperra"
path = "./src/main.rs"

[dependencies]
embassy-executor        = { version = "0.10.0", features = ["log"] }
embassy-futures         = "0.1.2"
embassy-net             = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
embassy-sync            = "0.8.0"
embassy-time            = { version = "0.5.0", features = ["log"] }
esp-bootloader-esp-idf  = { version = "0.5.0", features = ["esp32s3", "log-04"] }
esp-backtrace           = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal                 = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-println             = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-radio               = { version = "0.18.0", features = ["esp32s3", "log-04", "wifi"] }
esp-rtos                = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-storage             = { version = "0.9.0", features = ["esp32s3"] }

critical-section        = "1.2.0"
embedded-io-async       = "0.7.0"
embedded-storage        = "0.3.1"
esp-alloc               = "0.10.0"
heapless                = { version = "0.9.1", features = ["serde"] }
log                     = "0.4.28"
mbedtls-rs              = { version = "0.1.0", features = ["embassy-time", "esp32s3", "hook-wall-clock", "log", "use-gcc"] }
onewire                 = "0.4.0"
rand_core               = "0.10.1"
reqwless                = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false, features = ["log", "mbedtls-rs"] }
sntpc                   = "0.11.0"
sntpc-net-embassy       = "0.11.0"
static_cell             = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
