[package]
edition      = "2024"
name         = "esperra"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esperra"
path = "./src/main.rs"

[dependencies]
embassy-executor        = { version = "0.10.0", features = ["log"] }
embassy-futures         = "0.1.2"
embassy-sync            = "0.8.0"
embassy-time            = { version = "0.5.0", features = ["log"] }
esp-bootloader-esp-idf  = { version = "0.5.0", features = ["esp32s3", "log-04"] }
esp-hal                 = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-println             = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-rtos                = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-storage             = { version = "0.9.0", features = ["esp32s3"] }

critical-section        = "1.2.0"
embedded-storage        = "0.3.1"
esp-alloc               = "0.10.0"
log                     = "0.4.27"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
